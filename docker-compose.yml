# Local PostgreSQL for development:  docker compose up -d db
# Full stack (production-like):       docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["full"]
    depends_on:
      db: { condition: service_healthy }
    env_file: server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://marketplace:marketplace@db:5432/marketplace
      AUTO_MIGRATE: "true"
      APP_URL: http://localhost:4000
    ports: ["4000:4000"]
    volumes: [uploads:/app/server/storage]

volumes:
  pgdata:
  uploads:
