<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SaudaGo</title>
    <!--SEO_HEAD-->
    <style>
      /* Crawlable text snapshot: readable by search engines, never shown to people. */
      .seo-snapshot{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
      /* Branded loading screen shown until the app starts. */
      .seo-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
      .seo-splash p{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;color:#1c1917}
      .seo-spin{width:34px;height:34px;border-radius:50%;border:3px solid #e7e5e4;border-top-color:#0d9488;animation:seo-rot .8s linear infinite}
      @keyframes seo-rot{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"><!--SEO_BODY--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
